name: Lighthouse report

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit the published personal site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://wuxiyang1996.github.io/
            https://wuxiyang1996.github.io/publications/
            https://wuxiyang1996.github.io/cv/
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: false
